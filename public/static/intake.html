<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Intake - F-AI bian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-orange': '#FF6B35',
              'brand-blue': '#004E89'
            }
          }
        }
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-brand-blue to-brand-orange text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <a href="/" class="text-white hover:text-gray-200">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Home
                </a>
                <h1 class="text-3xl font-bold mt-4">
                    <i class="fas fa-user-plus mr-3"></i>
                    Patient Intake Form
                </h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 py-8">
            <div class="bg-white rounded-lg shadow-md p-8">
                <form id="intakeForm">
                    <!-- Demographics -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-brand-orange pb-2">
                            <i class="fas fa-user mr-2 text-brand-orange"></i>
                            Demographics
                        </h2>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
                                <input type="text" name="first_name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
                                <input type="text" name="last_name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth *</label>
                                <input type="date" name="date_of_birth" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
                                <select name="gender" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                                    <option value="">Select...</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <option value="prefer_not_to_say">Prefer not to say</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input type="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                                <input type="tel" name="phone" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-brand-blue pb-2">
                            <i class="fas fa-home mr-2 text-brand-blue"></i>
                            Address
                        </h2>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Address Line 1 *</label>
                                <input type="text" name="address_line1" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Address Line 2</label>
                                <input type="text" name="address_line2" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">City *</label>
                                <input type="text" name="city" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">State *</label>
                                <input type="text" name="state" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">ZIP Code *</label>
                                <input type="text" name="zip_code" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                        </div>
                    </div>

                    <!-- Emergency Contact -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-brand-orange pb-2">
                            <i class="fas fa-phone-alt mr-2 text-brand-orange"></i>
                            Emergency Contact
                        </h2>
                        <div class="grid md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                                <input type="text" name="emergency_contact_name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                                <input type="tel" name="emergency_contact_phone" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Relationship *</label>
                                <input type="text" name="emergency_contact_relationship" required placeholder="e.g., Spouse, Child" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                            </div>
                        </div>
                    </div>

                    <!-- Medical Information -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-brand-blue pb-2">
                            <i class="fas fa-notes-medical mr-2 text-brand-blue"></i>
                            Medical Information
                        </h2>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Primary Physician</label>
                                <input type="text" name="primary_physician" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Insurance Provider</label>
                                <input type="text" name="insurance_provider" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Insurance Policy Number</label>
                                <input type="text" name="insurance_policy_number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                        </div>
                    </div>

                    <!-- Assessment Context -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-brand-orange pb-2">
                            <i class="fas fa-clipboard-list mr-2 text-brand-orange"></i>
                            Assessment Context
                        </h2>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Assessment Reason *</label>
                                <select name="assessment_reason" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                                    <option value="">Select...</option>
                                    <option value="post_surgery">Post-Surgery Rehabilitation</option>
                                    <option value="fall_prevention">Fall Prevention</option>
                                    <option value="chronic_pain">Chronic Pain Management</option>
                                    <option value="mobility_decline">Mobility Decline</option>
                                    <option value="balance_issues">Balance Issues</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Activity Level *</label>
                                <select name="activity_level" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                                    <option value="">Select...</option>
                                    <option value="sedentary">Sedentary</option>
                                    <option value="light">Light Activity</option>
                                    <option value="moderate">Moderate Activity</option>
                                    <option value="active">Active</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Chief Complaint *</label>
                                <textarea name="chief_complaint" required rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Pain Scale (0-10) *</label>
                                <input type="number" name="pain_scale" required min="0" max="10" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-orange">
                                <p class="text-xs text-gray-500 mt-1">0 = No pain, 10 = Worst pain</p>
                            </div>
                        </div>
                    </div>

                    <!-- Height & Weight -->
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-brand-blue pb-2">
                            <i class="fas fa-weight mr-2 text-brand-blue"></i>
                            Physical Measurements
                        </h2>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Height (cm) *</label>
                                <input type="number" name="height_cm" required min="100" max="250" step="0.1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Weight (kg) *</label>
                                <input type="number" name="weight_kg" required min="30" max="300" step="0.1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-blue">
                            </div>
                        </div>
                    </div>

                    <!-- Status Message -->
                    <div id="statusMessage" class="mb-4 p-4 rounded-md hidden"></div>

                    <!-- Submit Button -->
                    <div class="flex justify-end space-x-4">
                        <a href="/" class="px-6 py-3 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors">
                            Cancel
                        </a>
                        <button type="submit" class="px-6 py-3 bg-gradient-to-r from-brand-orange to-brand-blue text-white rounded-md hover:shadow-lg transition-shadow">
                            <i class="fas fa-save mr-2"></i>
                            Submit & Continue to Assessment
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        const form = document.getElementById('intakeForm');
        const statusMessage = document.getElementById('statusMessage');

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `mb-4 p-4 rounded-md ${
                type === 'success' ? 'bg-green-100 text-green-700' :
                type === 'error' ? 'bg-red-100 text-red-700' :
                'bg-blue-100 text-blue-700'
            }`;
            statusMessage.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = {};
            
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }

            // Convert numeric fields
            data.pain_scale = parseInt(data.pain_scale);
            data.height_cm = parseFloat(data.height_cm);
            data.weight_kg = parseFloat(data.weight_kg);

            // Initialize JSON fields
            data.medical_history = {};
            data.current_medications = [];
            data.allergies = [];

            try {
                showStatus('Creating patient record...', 'info');
                
                const response = await fetch('/api/patients', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('✅ Patient created successfully! Redirecting to assessment...', 'success');
                    setTimeout(() => {
                        window.location.href = `/static/assessment.html?patient_id=${result.data.id}`;
                    }, 1500);
                } else {
                    showStatus('❌ Error: ' + result.error, 'error');
                }
            } catch (error) {
                showStatus('❌ Network error: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
