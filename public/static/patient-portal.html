<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal - ThriveOrtho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-blue': '#0066CC',
              'brand-green': '#00C851'
            }
          }
        }
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #003D7A 0%, #0055AA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .input-group {
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .input-group input {
            padding-left: 48px;
        }
    </style>
</head>
<body>
    <div class="login-card w-full max-w-md mx-4">
        <!-- Logo and Title -->
        <div class="bg-white rounded-t-2xl p-8 text-center">
            <div class="inline-block p-4 bg-brand-blue rounded-full mb-4">
                <i class="fas fa-heartbeat text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">ThriveOrtho</h1>
            <p class="text-gray-600">Patient Exercise Portal</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white p-8 rounded-b-2xl shadow-2xl">
            <h2 class="text-xl font-semibold text-gray-800 mb-6">Access Your Exercise Program</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Patient ID Input -->
                <div class="input-group mb-4">
                    <label for="patientId" class="block text-sm font-medium text-gray-700 mb-2">
                        Patient ID
                    </label>
                    <i class="fas fa-id-card"></i>
                    <input 
                        type="text" 
                        id="patientId" 
                        name="patientId"
                        placeholder="Enter your patient ID"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-brand-blue focus:outline-none transition-colors"
                    >
                </div>

                <!-- Last Name Input -->
                <div class="input-group mb-6">
                    <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">
                        Last Name
                    </label>
                    <i class="fas fa-user"></i>
                    <input 
                        type="text" 
                        id="lastName" 
                        name="lastName"
                        placeholder="Enter your last name"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-brand-blue focus:outline-none transition-colors"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full bg-brand-blue text-white py-3 rounded-lg font-semibold hover:bg-blue-900 transition-colors shadow-lg"
                >
                    <i class="fas fa-arrow-right mr-2"></i>
                    Access My Exercises
                </button>
            </form>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                <span class="text-red-700 text-sm"></span>
            </div>

            <!-- Demo Access -->
            <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="text-sm text-yellow-800 mb-2">
                    <i class="fas fa-lightbulb mr-1"></i>
                    <strong>Demo Access:</strong>
                </p>
                <button 
                    onclick="useDemoCredentials()"
                    class="text-xs text-yellow-700 underline hover:text-yellow-900"
                >
                    Click here to try with demo credentials
                </button>
            </div>

            <!-- Help Text -->
            <div class="mt-6 text-center text-sm text-gray-600">
                <p>
                    <i class="fas fa-question-circle mr-1"></i>
                    Need help? Contact your therapist for your patient ID.
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center text-white text-sm">
            <p>&copy; 2025 ThriveOrtho. All rights reserved.</p>
        </div>
    </div>

    <script>
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('patientSession');
            if (session) {
                // Already logged in, redirect to dashboard
                window.location.href = '/static/patient-dashboard.html';
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const patientId = document.getElementById('patientId').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            // Hide previous error
            errorMessage.classList.add('hidden');
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Verifying...';
            
            try {
                // Call authentication API
                const response = await fetch('/api/patient/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patientId, lastName })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Save session to localStorage
                    localStorage.setItem('patientSession', JSON.stringify({
                        ...data.patient,
                        loginTime: new Date().toISOString()
                    }));
                    
                    // Show success and redirect
                    loginBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Success! Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = '/static/patient-dashboard.html';
                    }, 1000);
                } else {
                    // Show error
                    showError(data.message || 'Invalid credentials. Please check your Patient ID and Last Name.');
                    resetLoginButton();
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.');
                resetLoginButton();
            }
        }
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.querySelector('span').textContent = message;
            errorMessage.classList.remove('hidden');
        }
        
        function resetLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-arrow-right mr-2"></i>Access My Exercises';
        }
        
        function useDemoCredentials() {
            document.getElementById('patientId').value = 'DEMO001';
            document.getElementById('lastName').value = 'Smith';
            
            // Show helper message
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.classList.remove('hidden');
            errorMessage.className = 'mt-4 p-3 bg-blue-50 border border-blue-200 rounded-lg';
            errorMessage.querySelector('i').className = 'fas fa-info-circle text-blue-500 mr-2';
            errorMessage.querySelector('span').className = 'text-blue-700 text-sm';
            errorMessage.querySelector('span').textContent = 'Demo credentials loaded. Click "Access My Exercises" to continue.';
        }
    </script>
</body>
</html>
