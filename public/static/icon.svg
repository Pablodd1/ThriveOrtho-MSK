<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C851;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E676;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glass Background Circle -->
  <circle cx="24" cy="24" r="22" fill="url(#blueGradient)" opacity="0.15"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  
  <!-- Medical Cross Icon -->
  <g filter="url(#glow)">
    <rect x="21" y="12" width="6" height="24" rx="3" fill="white"/>
    <rect x="12" y="21" width="24" height="6" rx="3" fill="white"/>
  </g>
  
  <!-- Motion Lines -->
  <g opacity="0.8">
    <path d="M 6 10 L 11 10" stroke="url(#greenGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 4 18 L 10 18" stroke="url(#greenGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 5 26 L 10 26" stroke="url(#greenGradient)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Tech Sparkles -->
  <circle cx="38" cy="14" r="2" fill="url(#greenGradient)"/>
  <circle cx="42" cy="22" r="1.5" fill="url(#greenGradient)" opacity="0.7"/>
  <circle cx="39" cy="32" r="2" fill="url(#greenGradient)"/>
</svg>
