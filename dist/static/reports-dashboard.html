<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Reports Dashboard - ThriveOrtho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-blue': '#0066CC',
              'brand-green': '#00C851'
            }
          }
        }
      }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/glassmorphism.css" rel="stylesheet">
    <style>
        .report-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .report-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        .score-badge {
            font-size: 3rem;
            font-weight: bold;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <div class="bg-brand-blue text-white p-6 shadow-lg">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">Assessment Reports Dashboard</h1>
                    <p class="text-sm opacity-90">Real-Time Functional Movement Assessments</p>
                </div>
                <div class="space-x-3">
                    <a href="/static/demo-data-generator.html" class="px-4 py-2 bg-white text-brand-blue rounded-lg font-semibold hover:bg-gray-100 transition-colors">
                        <i class="fas fa-database mr-2"></i>
                        Generate Demo Data
                    </a>
                    <a href="/static/assessment-realtime.html?quick=true" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-semibold transition-colors">
                        <i class="fas fa-plus mr-2"></i>
                        New Assessment
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto p-6">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-bold text-brand-blue" id="totalPatients">0</div>
                        <div class="text-sm text-gray-600">Total Patients</div>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-users text-brand-blue text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-bold text-green-600" id="avgScore">0.0</div>
                        <div class="text-sm text-gray-600">Avg FMS Score</div>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-star text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-bold text-yellow-600" id="totalIssues">0</div>
                        <div class="text-sm text-gray-600">Total Issues</div>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-exclamation-triangle text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-3xl font-bold text-purple-600" id="totalFrames">0</div>
                        <div class="text-sm text-gray-600">Data Frames</div>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-chart-line text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter & Search -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="searchInput" placeholder="Search patients..." 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue focus:border-transparent"
                        onkeyup="filterReports()">
                </div>
                <div>
                    <select id="scoreFilter" onchange="filterReports()" 
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue">
                        <option value="all">All Scores</option>
                        <option value="3">Score 3 (Excellent)</option>
                        <option value="2">Score 2 (Good)</option>
                        <option value="1">Score 1 (Poor)</option>
                        <option value="0">Score 0 (Pain)</option>
                    </select>
                </div>
                <div>
                    <select id="sortBy" onchange="filterReports()" 
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-blue">
                        <option value="date">Sort by Date</option>
                        <option value="score">Sort by Score</option>
                        <option value="name">Sort by Name</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Reports Grid -->
        <div id="reportsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Will be populated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <i class="fas fa-clipboard-list text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-600 mb-2">No Reports Found</h3>
            <p class="text-gray-500 mb-6">Generate demo data or create a new assessment to get started.</p>
            <a href="/static/demo-data-generator.html" class="inline-block px-6 py-3 bg-brand-blue hover:bg-blue-700 text-white rounded-lg font-semibold">
                <i class="fas fa-database mr-2"></i>
                Generate Demo Data
            </a>
        </div>
    </div>

    <script>
        let allReports = [];

        // ============================================
        // LOAD REPORTS
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            loadAllReports();
        });

        function loadAllReports() {
            allReports = [];
            
            // Check for demo reports (PT002, PT003, PT004)
            ['PT002', 'PT003', 'PT004'].forEach(patientId => {
                const storageKey = `demo_report_${patientId}`;
                const reportData = sessionStorage.getItem(storageKey);
                
                if (reportData) {
                    try {
                        const report = JSON.parse(reportData);
                        allReports.push(report);
                    } catch (e) {
                        console.error(`Error parsing report for ${patientId}:`, e);
                    }
                }
            });
            
            // Check for latest assessment report
            const latestReport = sessionStorage.getItem('latestAssessmentReport');
            if (latestReport) {
                try {
                    const report = JSON.parse(latestReport);
                    // Only add if not already in demo reports
                    if (!allReports.find(r => r.patient_id === report.patient_id)) {
                        allReports.push(report);
                    }
                } catch (e) {
                    console.error('Error parsing latest report:', e);
                }
            }
            
            if (allReports.length === 0) {
                showEmptyState();
            } else {
                updateStats();
                displayReports(allReports);
            }
        }

        // ============================================
        // DISPLAY FUNCTIONS
        // ============================================
        function displayReports(reports) {
            const container = document.getElementById('reportsContainer');
            const emptyState = document.getElementById('emptyState');
            
            if (reports.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            container.innerHTML = '';
            
            reports.forEach(report => {
                const card = createReportCard(report);
                container.appendChild(card);
            });
        }

        function createReportCard(report) {
            const card = document.createElement('div');
            card.className = 'report-card bg-white rounded-lg shadow p-6 cursor-pointer';
            card.onclick = () => viewReport(report.patient_id);
            
            const scoreColor = 
                report.fms_score === 3 ? 'text-green-600' :
                report.fms_score === 2 ? 'text-yellow-600' : 
                report.fms_score === 1 ? 'text-red-600' : 'text-red-800';
            
            const scoreText = 
                report.fms_score === 3 ? 'Excellent' :
                report.fms_score === 2 ? 'Good' :
                report.fms_score === 1 ? 'Poor' : 'Pain Present';
            
            const date = new Date(report.assessment_date);
            const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Calculate average symmetry
            let avgSymmetry = 0;
            if (report.symmetry_indices) {
                const hipAvg = report.symmetry_indices.hip.map(Math.abs).reduce((a, b) => a + b, 0) / report.symmetry_indices.hip.length;
                const kneeAvg = report.symmetry_indices.knee.map(Math.abs).reduce((a, b) => a + b, 0) / report.symmetry_indices.knee.length;
                avgSymmetry = ((hipAvg + kneeAvg) / 2).toFixed(1);
            }
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <h3 class="text-lg font-bold text-gray-800">${report.patient_name || report.patient_id}</h3>
                        <p class="text-xs text-gray-500">${report.patient_id}</p>
                        ${report.patient_info ? `
                            <p class="text-xs text-gray-600 mt-1">${report.patient_info.chief_complaint || ''}</p>
                        ` : ''}
                    </div>
                    <div class="text-center ml-4">
                        <div class="score-badge ${scoreColor}">${report.fms_score}</div>
                        <div class="text-xs text-gray-500">/ 3</div>
                    </div>
                </div>
                
                <div class="space-y-2 mb-4">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-600"><i class="fas fa-calendar mr-2"></i>Date:</span>
                        <span class="font-semibold text-gray-800">${dateStr}</span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-600"><i class="fas fa-redo mr-2"></i>Reps:</span>
                        <span class="font-semibold text-gray-800">${report.reps_completed}/${report.target_reps}</span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-600"><i class="fas fa-clock mr-2"></i>Duration:</span>
                        <span class="font-semibold text-gray-800">${report.duration}s</span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-600"><i class="fas fa-balance-scale mr-2"></i>Symmetry:</span>
                        <span class="font-semibold ${avgSymmetry < 10 ? 'text-green-600' : avgSymmetry < 20 ? 'text-yellow-600' : 'text-red-600'}">
                            ${avgSymmetry}%
                        </span>
                    </div>
                </div>
                
                <div class="border-t pt-3 mb-3">
                    <div class="flex items-center justify-between text-sm mb-2">
                        <span class="font-semibold text-gray-700">Status:</span>
                        <span class="px-2 py-1 ${scoreColor} bg-opacity-10 rounded-full text-xs font-semibold">
                            ${scoreText}
                        </span>
                    </div>
                    ${report.compensations && report.compensations.length > 0 ? `
                        <div class="text-xs text-gray-600">
                            <i class="fas fa-exclamation-triangle text-yellow-500 mr-1"></i>
                            ${report.compensations.length} issue${report.compensations.length > 1 ? 's' : ''} detected
                        </div>
                    ` : `
                        <div class="text-xs text-green-600">
                            <i class="fas fa-check-circle mr-1"></i>
                            No compensations detected
                        </div>
                    `}
                </div>
                
                <button onclick="event.stopPropagation(); viewReport('${report.patient_id}')" 
                    class="w-full px-4 py-2 bg-brand-blue hover:bg-blue-700 text-white rounded-lg font-semibold transition-colors">
                    <i class="fas fa-file-medical mr-2"></i>
                    View Full Report
                </button>
            `;
            
            return card;
        }

        function showEmptyState() {
            document.getElementById('reportsContainer').innerHTML = '';
            document.getElementById('emptyState').classList.remove('hidden');
            updateStats();
        }

        // ============================================
        // STATS UPDATE
        // ============================================
        function updateStats() {
            const totalPatients = allReports.length;
            const avgScore = totalPatients > 0 ? 
                (allReports.reduce((sum, r) => sum + r.fms_score, 0) / totalPatients).toFixed(1) : 0;
            const totalIssues = allReports.reduce((sum, r) => sum + (r.compensations ? r.compensations.length : 0), 0);
            const totalFrames = allReports.reduce((sum, r) => sum + (r.joint_angles ? r.joint_angles.hip_left.length : 0), 0);
            
            document.getElementById('totalPatients').textContent = totalPatients;
            document.getElementById('avgScore').textContent = avgScore;
            document.getElementById('totalIssues').textContent = totalIssues;
            document.getElementById('totalFrames').textContent = totalFrames.toLocaleString();
        }

        // ============================================
        // FILTER & SEARCH
        // ============================================
        function filterReports() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const scoreFilter = document.getElementById('scoreFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            
            let filtered = allReports.filter(report => {
                // Search filter
                const matchesSearch = !searchTerm || 
                    (report.patient_name && report.patient_name.toLowerCase().includes(searchTerm)) ||
                    report.patient_id.toLowerCase().includes(searchTerm) ||
                    (report.patient_info && report.patient_info.chief_complaint && 
                     report.patient_info.chief_complaint.toLowerCase().includes(searchTerm));
                
                // Score filter
                const matchesScore = scoreFilter === 'all' || 
                    report.fms_score === parseInt(scoreFilter);
                
                return matchesSearch && matchesScore;
            });
            
            // Sort
            if (sortBy === 'score') {
                filtered.sort((a, b) => b.fms_score - a.fms_score);
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => {
                    const nameA = a.patient_name || a.patient_id;
                    const nameB = b.patient_name || b.patient_id;
                    return nameA.localeCompare(nameB);
                });
            } else {
                // Sort by date (newest first)
                filtered.sort((a, b) => new Date(b.assessment_date) - new Date(a.assessment_date));
            }
            
            displayReports(filtered);
        }

        // ============================================
        // VIEW REPORT
        // ============================================
        function viewReport(patientId) {
            // Find the report
            const report = allReports.find(r => r.patient_id === patientId);
            
            if (report) {
                // Store as latestAssessmentReport for report viewer
                sessionStorage.setItem('latestAssessmentReport', JSON.stringify(report));
                window.open('/static/assessment-report.html?patient=' + patientId, '_blank');
            } else {
                alert('Report not found.');
            }
        }
    </script>
</body>
</html>
