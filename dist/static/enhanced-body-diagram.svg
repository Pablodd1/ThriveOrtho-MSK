<!-- Enhanced Human Body Diagram - Front View -->
<svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <ellipse cx="150" cy="50" rx="35" ry="42" fill="#FFE4C4" stroke="#8B4513" stroke-width="2"/>
  <circle cx="140" cy="45" r="3" fill="#000"/>
  <circle cx="160" cy="45" r="3" fill="#000"/>
  
  <!-- Neck -->
  <rect x="140" y="85" width="20" height="20" fill="#FFE4C4" stroke="#8B4513" stroke-width="1.5"/>
  
  <!-- Torso/Chest -->
  <ellipse cx="150" cy="160" rx="50" ry="70" fill="#E6D5B8" stroke="#8B4513" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">Chest</text>
  
  <!-- Abdomen -->
  <ellipse cx="150" cy="250" rx="45" ry="50" fill="#F5E6D3" stroke="#8B4513" stroke-width="2"/>
  <text x="150" y="250" text-anchor="middle" font-size="13" fill="#666">Abdomen</text>
  
  <!-- Pelvis -->
  <ellipse cx="150" cy="320" rx="48" ry="30" fill="#E6D5B8" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Left Arm -->
  <line x1="103" y1="115" x2="70" y2="160" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <line x1="70" y1="160" x2="60" y2="230" stroke="#8B4513" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="63" cy="245" rx="8" ry="10" fill="#FFE4C4" stroke="#8B4513" stroke-width="1.5"/>
  <text x="35" y="190" text-anchor="middle" font-size="12" fill="#555">L Arm</text>
  
  <!-- Right Arm -->
  <line x1="197" y1="115" x2="230" y2="160" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <line x1="230" y1="160" x2="240" y2="230" stroke="#8B4513" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="237" cy="245" rx="8" ry="10" fill="#FFE4C4" stroke="#8B4513" stroke-width="1.5"/>
  <text x="265" y="190" text-anchor="middle" font-size="12" fill="#555">R Arm</text>
  
  <!-- Left Leg -->
  <line x1="130" y1="345" x2="125" y2="470" stroke="#8B4513" stroke-width="10" stroke-linecap="round"/>
  <circle cx="125" cy="360" r="10" fill="#E6D5B8" stroke="#8B4513" stroke-width="1.5"/>
  <circle cx="125" cy="420" r="8" fill="#E6D5B8" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="125" y1="470" x2="120" y2="550" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="120" cy="565" rx="15" ry="8" fill="#8B4513" stroke="#654321" stroke-width="1.5"/>
  <text x="95" y="455" text-anchor="middle" font-size="12" fill="#555">L Leg</text>
  <text x="115" y="370" text-anchor="end" font-size="10" fill="#777">Hip</text>
  <text x="115" y="425" text-anchor="end" font-size="10" fill="#777">Knee</text>
  
  <!-- Right Leg -->
  <line x1="170" y1="345" x2="175" y2="470" stroke="#8B4513" stroke-width="10" stroke-linecap="round"/>
  <circle cx="175" cy="360" r="10" fill="#E6D5B8" stroke="#8B4513" stroke-width="1.5"/>
  <circle cx="175" cy="420" r="8" fill="#E6D5B8" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="175" y1="470" x2="180" y2="550" stroke="#8B4513" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="180" cy="565" rx="15" ry="8" fill="#8B4513" stroke="#654321" stroke-width="1.5"/>
  <text x="205" y="455" text-anchor="middle" font-size="12" fill="#555">R Leg</text>
  <text x="185" y="370" text-anchor="start" font-size="10" fill="#777">Hip</text>
  <text x="185" y="425" text-anchor="start" font-size="10" fill="#777">Knee</text>
  
  <!-- Joint Markers for Medical Reference -->
  <circle cx="103" cy="115" r="4" fill="#FF6B35" opacity="0.7"/>
  <circle cx="197" cy="115" r="4" fill="#FF6B35" opacity="0.7"/>
  <text x="103" y="105" text-anchor="middle" font-size="9" fill="#FF6B35">Shoulder</text>
  <text x="197" y="105" text-anchor="middle" font-size="9" fill="#FF6B35">Shoulder</text>
</svg>
