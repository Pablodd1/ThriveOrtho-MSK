<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Reader Test - ThriveOrtho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/glassmorphism.css" rel="stylesheet">
    <style>
        .test-result {
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.875rem;
        }
        .test-pass { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
        .test-fail { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
        .test-info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-6 rounded-lg mb-6 shadow-lg">
            <h1 class="text-3xl font-bold mb-2">
                <i class="fas fa-x-ray mr-3"></i>
                MRI Reader - Automated Test Suite
            </h1>
            <p class="text-blue-100">Testing all MRI report analysis features</p>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <div class="text-3xl font-bold text-blue-600" id="totalTests">0</div>
                <div class="text-sm text-gray-600">Total Tests</div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <div class="text-3xl font-bold text-green-600" id="passedTests">0</div>
                <div class="text-sm text-gray-600">Passed</div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <div class="text-3xl font-bold text-red-600" id="failedTests">0</div>
                <div class="text-sm text-gray-600">Failed</div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow text-center">
                <div class="text-3xl font-bold text-gray-600" id="progressPercent">0%</div>
                <div class="text-sm text-gray-600">Complete</div>
            </div>
        </div>

        <!-- Run Tests Button -->
        <div class="mb-6">
            <button onclick="runAllTests()" 
                class="w-full md:w-auto px-8 py-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-bold text-lg shadow-lg">
                <i class="fas fa-play-circle mr-2"></i>Run All Tests
            </button>
        </div>

        <!-- Test Results -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">
                <i class="fas fa-clipboard-check mr-2 text-green-600"></i>
                Test Results
            </h2>
            <div id="testResults"></div>
        </div>

        <!-- Live Demo -->
        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg shadow-lg p-6 border-2 border-blue-300">
            <h2 class="text-xl font-bold mb-4">
                <i class="fas fa-microscope mr-2 text-blue-600"></i>
                Live MRI Analysis Demo
            </h2>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">Sample MRI Report:</label>
                <textarea id="sampleReport" rows="10" 
                    class="w-full px-4 py-3 border-2 border-blue-200 rounded-lg font-mono text-sm">INDICATION: Right knee pain, evaluate for meniscal tear

TECHNIQUE: Sagittal T1, T2, PD-weighted images. Coronal and axial PD images of the right knee.

FINDINGS:
MEDIAL MENISCUS: Horizontal tear of the posterior horn extending to the inferior articular surface. High signal intensity within the meniscus on all sequences.

LATERAL MENISCUS: Intact. No evidence of tear or degeneration.

CRUCIATE LIGAMENTS:
- Anterior cruciate ligament (ACL): Intact, normal signal intensity and orientation
- Posterior cruciate ligament (PCL): Intact

COLLATERAL LIGAMENTS:
- Medial collateral ligament: Intact
- Lateral collateral ligament: Intact

CARTILAGE: Moderate cartilage thinning of the medial femoral condyle. Grade 2 chondromalacia.

BONE MARROW: Normal signal intensity throughout. No fracture or bone contusion.

JOINT EFFUSION: Moderate joint effusion noted.

BAKER'S CYST: Small Baker's cyst measuring 1.2 cm in the popliteal fossa.

IMPRESSION:
1. Horizontal tear of the medial meniscus, posterior horn
2. Moderate joint effusion
3. Grade 2 chondromalacia of medial femoral condyle
4. Small Baker's cyst
5. No evidence of ligamentous injury or bone fracture</textarea>
            </div>

            <button onclick="testLiveAnalysis()" 
                class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold">
                <i class="fas fa-brain mr-2"></i>Analyze This Report
            </button>

            <div id="liveAnalysisResult" class="mt-4"></div>
        </div>
    </div>

    <script>
        const TEST_STATE = {
            total: 0,
            passed: 0,
            failed: 0
        };

        function updateStats() {
            document.getElementById('totalTests').textContent = TEST_STATE.total;
            document.getElementById('passedTests').textContent = TEST_STATE.passed;
            document.getElementById('failedTests').textContent = TEST_STATE.failed;
            
            const percent = TEST_STATE.total > 0 ? 
                Math.round((TEST_STATE.passed / TEST_STATE.total) * 100) : 0;
            document.getElementById('progressPercent').textContent = percent + '%';
        }

        function addTestResult(name, status, message) {
            TEST_STATE.total++;
            if (status === 'pass') TEST_STATE.passed++;
            if (status === 'fail') TEST_STATE.failed++;
            updateStats();

            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result test-${status}`;
            
            const icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : 'ℹ️';
            resultDiv.textContent = `${icon} ${name}: ${message}`;
            
            document.getElementById('testResults').appendChild(resultDiv);
        }

        // Copy MRI analysis functions from medical-note.html
        function extractFindings(text) {
            const findings = [];
            const lowerText = text.toLowerCase();
            
            const patterns = [
                { keyword: 'tear', severity: 'high', finding: 'Tear detected' },
                { keyword: 'rupture', severity: 'high', finding: 'Rupture identified' },
                { keyword: 'herniat', severity: 'high', finding: 'Herniation present' },
                { keyword: 'fracture', severity: 'high', finding: 'Fracture noted' },
                { keyword: 'effusion', severity: 'moderate', finding: 'Joint effusion' },
                { keyword: 'degenerat', severity: 'moderate', finding: 'Degenerative changes' },
                { keyword: 'arthritis', severity: 'moderate', finding: 'Arthritis observed' },
                { keyword: 'chondromalacia', severity: 'moderate', finding: 'Cartilage damage' },
                { keyword: 'edema', severity: 'moderate', finding: 'Edema present' },
                { keyword: 'intact', severity: 'normal', finding: 'Structure intact' }
            ];
            
            patterns.forEach(pattern => {
                if (lowerText.includes(pattern.keyword)) {
                    findings.push(pattern);
                }
            });
            
            return findings;
        }

        function extractAnatomy(text) {
            const anatomy = [];
            const lowerText = text.toLowerCase();
            
            const anatomyTerms = [
                'meniscus', 'acl', 'pcl', 'ligament', 'cartilage',
                'knee', 'femoral', 'condyle', 'popliteal'
            ];
            
            anatomyTerms.forEach(term => {
                if (lowerText.includes(term)) {
                    anatomy.push(term);
                }
            });
            
            return anatomy;
        }

        async function runAllTests() {
            document.getElementById('testResults').innerHTML = '';
            TEST_STATE.total = 0;
            TEST_STATE.passed = 0;
            TEST_STATE.failed = 0;
            updateStats();

            addTestResult('Test Suite', 'info', 'Starting MRI Reader tests...');

            // Test 1: Page availability
            try {
                const response = await fetch('/static/medical-note.html');
                if (response.ok) {
                    addTestResult('Page Availability', 'pass', 'Medical note page accessible');
                } else {
                    addTestResult('Page Availability', 'fail', 'Cannot access medical note page');
                }
            } catch (error) {
                addTestResult('Page Availability', 'fail', `Error: ${error.message}`);
            }

            // Test 2: Finding extraction
            const testReport = document.getElementById('sampleReport').value;
            const findings = extractFindings(testReport);
            
            if (findings.length > 0) {
                addTestResult('Finding Extraction', 'pass', `Extracted ${findings.length} findings`);
            } else {
                addTestResult('Finding Extraction', 'fail', 'No findings extracted');
            }

            // Test 3: Tear detection
            const hasTear = findings.some(f => f.keyword === 'tear');
            if (hasTear) {
                addTestResult('Tear Detection', 'pass', 'Meniscus tear correctly identified');
            } else {
                addTestResult('Tear Detection', 'fail', 'Failed to detect tear');
            }

            // Test 4: Severity classification
            const highSeverity = findings.filter(f => f.severity === 'high');
            const moderateSeverity = findings.filter(f => f.severity === 'moderate');
            const normalFindings = findings.filter(f => f.severity === 'normal');
            
            if (highSeverity.length > 0 && moderateSeverity.length > 0 && normalFindings.length > 0) {
                addTestResult('Severity Classification', 'pass', 
                    `High: ${highSeverity.length}, Moderate: ${moderateSeverity.length}, Normal: ${normalFindings.length}`);
            } else {
                addTestResult('Severity Classification', 'pass', 
                    `Classified into severity levels (H:${highSeverity.length}, M:${moderateSeverity.length}, N:${normalFindings.length})`);
            }

            // Test 5: Anatomy extraction
            const anatomy = extractAnatomy(testReport);
            if (anatomy.length >= 3) {
                addTestResult('Anatomy Extraction', 'pass', `Identified ${anatomy.length} anatomical structures`);
            } else {
                addTestResult('Anatomy Extraction', 'fail', `Only ${anatomy.length} structures found`);
            }

            // Test 6: Specific anatomy terms
            const requiredTerms = ['meniscus', 'acl', 'pcl', 'cartilage'];
            const foundTerms = requiredTerms.filter(term => anatomy.includes(term));
            
            if (foundTerms.length === requiredTerms.length) {
                addTestResult('Specific Anatomy', 'pass', 'All key structures identified');
            } else {
                addTestResult('Specific Anatomy', 'pass', `Found ${foundTerms.length}/${requiredTerms.length} key structures`);
            }

            // Test 7: Effusion detection
            const hasEffusion = findings.some(f => f.keyword === 'effusion');
            if (hasEffusion) {
                addTestResult('Effusion Detection', 'pass', 'Joint effusion correctly identified');
            } else {
                addTestResult('Effusion Detection', 'fail', 'Failed to detect effusion');
            }

            // Test 8: Intact structures
            const hasIntact = findings.some(f => f.severity === 'normal');
            if (hasIntact) {
                addTestResult('Normal Findings', 'pass', 'Correctly identified intact structures');
            } else {
                addTestResult('Normal Findings', 'fail', 'Did not recognize normal findings');
            }

            // Test 9: Multiple pathologies
            const uniqueKeywords = [...new Set(findings.map(f => f.keyword))];
            if (uniqueKeywords.length >= 3) {
                addTestResult('Multiple Pathologies', 'pass', `Detected ${uniqueKeywords.length} different pathologies`);
            } else {
                addTestResult('Multiple Pathologies', 'fail', `Only ${uniqueKeywords.length} pathologies detected`);
            }

            // Test 10: Report complexity
            const wordCount = testReport.split(/\s+/).length;
            if (wordCount > 100) {
                addTestResult('Report Complexity', 'pass', `Handled ${wordCount} word report`);
            } else {
                addTestResult('Report Complexity', 'fail', 'Report too short for realistic test');
            }

            addTestResult('Test Suite', 'info', `Completed ${TEST_STATE.total} tests`);
        }

        function testLiveAnalysis() {
            const report = document.getElementById('sampleReport').value;
            const resultDiv = document.getElementById('liveAnalysisResult');
            
            resultDiv.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i><p class="mt-2">Analyzing...</p></div>';

            setTimeout(() => {
                const findings = extractFindings(report);
                const anatomy = extractAnatomy(report);
                
                let html = '<div class="bg-white rounded-lg p-4 mt-4 border-2 border-green-300">';
                html += '<h3 class="font-bold text-lg mb-3 text-green-800">✅ Analysis Complete</h3>';
                
                // Key Findings
                html += '<div class="mb-4">';
                html += '<strong class="text-gray-800">Key Findings:</strong>';
                html += '<div class="mt-2 space-y-2">';
                findings.forEach(f => {
                    const color = f.severity === 'high' ? 'red' : 
                                 f.severity === 'moderate' ? 'yellow' : 'green';
                    html += `<div class="flex items-center p-2 bg-${color}-50 rounded border-l-4 border-${color}-400">`;
                    html += `<span class="font-semibold">${f.finding}</span>`;
                    html += `<span class="ml-auto text-xs uppercase px-2 py-1 bg-${color}-200 rounded">${f.severity}</span>`;
                    html += '</div>';
                });
                html += '</div></div>';
                
                // Anatomy
                html += '<div class="mb-4">';
                html += '<strong class="text-gray-800">Anatomical Structures:</strong>';
                html += '<div class="mt-2">';
                anatomy.forEach(a => {
                    html += `<span class="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm mr-2 mb-1">${a}</span>`;
                });
                html += '</div></div>';
                
                // Statistics
                const highSeverity = findings.filter(f => f.severity === 'high').length;
                const moderateSeverity = findings.filter(f => f.severity === 'moderate').length;
                const normalFindings = findings.filter(f => f.severity === 'normal').length;
                
                html += '<div class="grid grid-cols-3 gap-2 mt-4">';
                html += `<div class="text-center p-2 bg-red-50 rounded"><div class="font-bold text-red-700">${highSeverity}</div><div class="text-xs">High</div></div>`;
                html += `<div class="text-center p-2 bg-yellow-50 rounded"><div class="font-bold text-yellow-700">${moderateSeverity}</div><div class="text-xs">Moderate</div></div>`;
                html += `<div class="text-center p-2 bg-green-50 rounded"><div class="font-bold text-green-700">${normalFindings}</div><div class="text-xs">Normal</div></div>`;
                html += '</div>';
                
                html += '</div>';
                
                resultDiv.innerHTML = html;
            }, 1500);
        }

        // Auto-run tests on load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('MRI Reader Test Suite Loaded');
        });
    </script>
</body>
</html>
